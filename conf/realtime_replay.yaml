offline:
  nav: [data/sim/tw_quiet/brdc.nav]     # ephemerides for the replay
server:
  datum_mounts:                   # VRS_MSM7_TWD97_2010 ... (1006 position in the datum)
    - {datum: TWD97_2010}
    - {datum: TWD97_2020}
  port: 2101
  sync_window_s: 0.5
  gga_timeout_s: 15
  allow_anonymous: true
  replay_speed: 1.0
