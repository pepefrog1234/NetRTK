# Experiment: can a single large triangle 台中 WFEN – 台南 NCKU – 台東 LONT (130 / 88 / 133 km,
# all Trimble Alloy) serve rovers inside it? Same data, coordinates and solver settings as
# tw_all_30s.yaml (DOY 270, 30 s, GPS+Galileo); only the three vertices are enabled, the other
# stations listed are leave-out rovers: interior (JSAN LGU2 SHWA GAIS ALIS), 2-3 km outside an
# edge (FKD2 TUNS, which have dense-network results in docs/VALIDATION.md 9.4) and CHIA (64 km from
# the nearest vertex). max_baseline_km raised so that the three long baselines are formed.
network:
  name: TW-bigtri
  frame: ITRF2020
  epoch: 2026.74
  max_baseline_km: 140
  antex: data/real/atx/igs20.atx
