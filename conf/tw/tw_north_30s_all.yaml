# Northern Taiwan, CWA GDMS continuous stations (Trimble Alloy / NetR9), 2026-09-27 (DOY 270),
# 30 s RINEX 2.11 (GPS + Galileo processed; GLONASS ignored, QZSS/BDS absent). Ring of six stations
# 24-44 km apart (KYI2 HSIN BAL2 PLIN WALI TAN2); the seven interior stations are leave-out rovers.
# tw_north_30s_all.yaml enables every station (coordinate adjustment, dense-network experiments).
# Coordinates: datum = LNK2's receiver (RTX-like) position; all others estimated from the data
# (tools/twdata/station_coords.py as start, refined with tools/twdata/adjust_coords.py on DOY 270,
# then the mean correction of the six independent days DOY 271-276 added; day-to-day scatter of the
# heights 3-9 mm, see docs/VALIDATION.md 9.1). Replace with official coordinates when available.
# FUSN is disabled: its baselines fix < 65% even with adjusted coordinates (receiver data quality).
# Data: data/real/tw/ via tools/twdata/extract_gdms.sh (licence of the Central Weather Administration);
# other days: tools/twdata/config_for_day.py.
